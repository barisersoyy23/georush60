<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="Comic Sans MS, Segoe Print, cursive" font-size="15">
  <rect width="1200" height="760" fill="#fbfaf5"/>
  <text x="30" y="40" font-size="24" font-weight="bold">GeoRush 60 — frontend layout sketch</text>
  <!-- screen frame -->
  <rect x="30" y="60" width="1140" height="560" rx="10" fill="none" stroke="#222" stroke-width="2.5"/>
  <!-- HUD -->
  <rect x="30" y="60" width="1140" height="60" fill="#eee" stroke="#222" stroke-width="2"/>
  <text x="50" y="97" font-weight="bold">◎ GeoRush60</text>
  <rect x="380" y="75" width="80" height="34" fill="none" stroke="#555" stroke-dasharray="4 3"/><text x="392" y="97">SCORE</text>
  <rect x="470" y="75" width="80" height="34" fill="none" stroke="#555" stroke-dasharray="4 3"/><text x="478" y="97">LEVEL</text>
  <rect x="560" y="75" width="80" height="34" fill="none" stroke="#555" stroke-dasharray="4 3"/><text x="572" y="97">STREAK</text>
  <rect x="650" y="75" width="80" height="34" fill="none" stroke="#555" stroke-dasharray="4 3"/><text x="660" y="97" fill="#c23">♥ ♥ ♥</text>
  <text x="840" y="99" font-size="20" font-weight="bold">59.6</text>
  <rect x="900" y="84" width="250" height="14" rx="7" fill="#ffd27a" stroke="#222"/>
  <!-- map -->
  <rect x="30" y="120" width="820" height="500" fill="#dfe8f3" stroke="#222" stroke-width="2"/>
  <path d="M120 230 q60 -60 140 -20 q40 40 10 90 q-60 50 -110 10 z M300 400 q40 -30 70 10 q10 80 -40 120 q-50 -40 -30 -130 z M470 220 q80 -50 200 -20 q80 30 60 90 q-90 40 -170 20 q-80 -20 -90 -90 z M470 330 q50 -20 80 20 q20 90 -40 130 q-50 -60 -40 -150 z M690 420 q50 -10 70 30 q-20 40 -70 20 z" fill="#b9c6d8" stroke="#333"/>
  <path d="M510 360 q20 -10 30 10 q-10 25 -30 15 z" fill="#8fd9b0" stroke="#1a7"/>
  <text x="545" y="385" fill="#1a7">correct → green flash + pulse</text>
  <rect x="300" y="135" width="300" height="34" rx="17" fill="#fff" stroke="#c23"/><text x="315" y="157" fill="#c23">✖ That's X. Target is 1,240 km east</text>
  <text x="620" y="157" fill="#666">← toast feedback</text>
  <rect x="45" y="135" width="26" height="50" fill="#fff" stroke="#222"/><text x="52" y="157">+</text><text x="53" y="178">–</text>
  <text x="60" y="600" fill="#666">Leaflet map · no labels · D3 graticule · countries = clickable GeoJSON</text>
  <!-- side panel -->
  <rect x="850" y="120" width="320" height="500" fill="#f4f1e8" stroke="#222" stroke-width="2"/>
  <rect x="870" y="140" width="280" height="95" rx="8" fill="#fff" stroke="#222"/>
  <text x="885" y="163" font-size="12" fill="#666">FIND THIS COUNTRY</text>
  <text x="885" y="198" font-size="28" font-weight="bold">Brazil</text>
  <text x="885" y="222" font-size="12" fill="#666">Question 4 · Level 1</text>
  <rect x="870" y="250" width="280" height="30" rx="6" fill="#e6f0ff" stroke="#58a"/><text x="882" y="270">Region: Americas · South America</text>
  <rect x="870" y="286" width="280" height="30" rx="6" fill="#e6f0ff" stroke="#58a"/><text x="882" y="306">Flag: [img]</text>
  <text x="1010" y="335" font-size="12" fill="#666">↑ hints (−50 each)</text>
  <rect x="870" y="345" width="88" height="40" rx="6" fill="#fff" stroke="#222"/><text x="882" y="370">💡 Hint</text>
  <rect x="966" y="345" width="88" height="40" rx="6" fill="#fff" stroke="#222"/><text x="985" y="370">⏭ Skip</text>
  <rect x="1062" y="345" width="88" height="40" rx="6" fill="#fff" stroke="#222"/><text x="1070" y="370">⏸ Pause</text>
  <g fill="#ffb547" stroke="#222"><rect x="870" y="398" width="52" height="7" rx="3"/><rect x="927" y="398" width="52" height="7" rx="3" fill="#fff"/><rect x="984" y="398" width="52" height="7" rx="3" fill="#fff"/><rect x="1041" y="398" width="52" height="7" rx="3" fill="#fff"/><rect x="1098" y="398" width="52" height="7" rx="3" fill="#fff"/></g>
  <text x="870" y="425" font-size="12" fill="#666">level progress (5 levels)</text>
  <g stroke="#222" fill="#fff"><rect x="870" y="435" width="280" height="28"/><rect x="870" y="468" width="280" height="28"/><rect x="870" y="501" width="280" height="28"/></g>
  <text x="880" y="454">Türkiye <tspan x="1100">+436</tspan></text>
  <text x="880" y="487">Peru <tspan x="1085">2,130 km</tspan></text>
  <text x="880" y="520">Egypt <tspan x="1100">+271</tspan></text>
  <text x="870" y="550" font-size="12" fill="#666">answer log (last 6)</text>
  <!-- other screens -->
  <rect x="30" y="640" width="330" height="100" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="45" y="665" font-weight="bold">Start modal</text>
  <text x="45" y="688" font-size="13">rules · current record · [Start (Enter)]</text>
  <rect x="390" y="640" width="440" height="100" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="405" y="665" font-weight="bold">Game-over modal</text>
  <text x="405" y="688" font-size="13">final score · 4 stat cards · Chart.js bar chart of</text>
  <text x="405" y="706" font-size="13">answer times · top-5 leaderboard + name form ·</text>
  <text x="405" y="724" font-size="13">"countries to study" chips · [Play again]</text>
  <rect x="860" y="640" width="310" height="100" rx="10" fill="#fff" stroke="#222" stroke-width="2"/>
  <text x="875" y="665" font-weight="bold">Pause modal</text>
  <text x="875" y="688" font-size="13">blurs &amp; hides the map, clock stops</text>
  <text x="875" y="706" font-size="13">(P / Esc / tab switch)</text>
</svg>
